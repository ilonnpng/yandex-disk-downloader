name: Build release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: github.event_name != 'release' || !endsWith(github.event.release.tag_name, '-windows')
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Require a version tag
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Verify the selected commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: bash Scripts/test.sh
      - run: bash Scripts/build-app.sh
      - run: bash Scripts/package-release.sh
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.zip
      - name: Attach the build and checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "$RELEASE_TAG"
          dist/*.zip dist/SHA256SUMS.txt dist/BUILD_INFO.txt
          --repo "$GITHUB_REPOSITORY"
