name: Build Windows
on:
  push:
    branches: [main]
    paths:
      - Windows/**
      - Scripts/build-windows.ps1
      - .github/workflows/windows.yml
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    if: github.event_name != 'release' || endsWith(github.event.release.tag_name, '-windows')
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: pwsh -File Scripts/build-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Windows-build-and-layout
          path: |
            dist/*Windows*.zip
            dist/*Windows.txt
            dist/screenshot-windows.png
          if-no-files-found: error
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: github.event_name == 'release'
        with:
          subject-path: dist/*Windows*.zip
      - name: Attach Windows builds
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $archives = @(Get-ChildItem dist/*Windows*.zip | ForEach-Object { $_.FullName })
          gh release upload "$env:RELEASE_TAG" @archives dist/SHA256SUMS-Windows.txt dist/BUILD_INFO-Windows.txt --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
